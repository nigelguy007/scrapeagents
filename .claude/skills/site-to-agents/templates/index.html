<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} · {{SOURCE_NAME}}</title>
<style>
  :root {
    --bg: #0b0b0e;
    --panel: #131318;
    --panel-2: #1a1a21;
    --line: #26262f;
    --text: #ececf1;
    --muted: #8b8b98;
    --accent: #d4af6a;
    --accent-dim: rgba(212, 175, 106, .12);
    --user-bubble: #23232d;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    height: 100dvh; display: flex; overflow: hidden;
  }

  /* ── Sidebar ─────────────────────────────── */
  aside {
    width: 320px; min-width: 320px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .brand { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
  .brand h1 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .brand p { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .roster { overflow-y: auto; flex: 1; padding: 10px; }
  .agent {
    display: flex; gap: 12px; align-items: flex-start; width: 100%;
    padding: 12px; border: 1px solid transparent; border-radius: 12px;
    background: none; color: inherit; text-align: left; cursor: pointer;
    font: inherit; transition: background .15s;
  }
  .agent:hover { background: var(--panel-2); }
  .agent.active { background: var(--accent-dim); border-color: rgba(212,175,106,.35); }
  .agent .emoji { font-size: 22px; line-height: 1.2; }
  .agent .name { font-weight: 600; font-size: 13.5px; }
  .agent .tag { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .agent .kbadge { display:inline-block; margin-top:4px; font-size:10px; color:var(--accent); border:1px solid rgba(212,175,106,.4); border-radius:99px; padding:1px 7px; }

  /* ── Main ────────────────────────────────── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; background: var(--panel);
  }
  header .emoji { font-size: 26px; }
  header h2 { font-size: 16px; }
  header .module { color: var(--accent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; }

  #chat { flex: 1; overflow-y: auto; padding: 28px 0; }
  .msg { max-width: 780px; margin: 0 auto 18px; padding: 0 24px; display: flex; gap: 14px; }
  .msg .avatar { font-size: 20px; flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; }
  .msg.user .avatar { background: var(--user-bubble); }
  .msg .body { padding-top: 5px; min-width: 0; overflow-wrap: break-word; white-space: pre-wrap; }
  .msg .body strong { color: var(--accent); }
  .msg .body code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 13px; }
  .msg .body pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; margin: 10px 0; white-space: pre; }
  .msg .body pre code { background: none; border: none; padding: 0; }
  .intro-card {
    max-width: 780px; margin: 40px auto; padding: 0 24px; text-align: center; color: var(--muted);
  }
  .intro-card .big { font-size: 44px; margin-bottom: 14px; }
  .intro-card h3 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
  .error { color: #e07a7a; }

  /* ── Composer ────────────────────────────── */
  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 16px 24px 20px; }
  .composer-inner { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font: inherit; max-height: 180px; outline: none;
  }
  textarea:focus { border-color: rgba(212,175,106,.5); }
  button.send {
    background: var(--accent); color: #14100a; border: none; border-radius: 12px;
    padding: 12px 20px; font: 600 14px/1 inherit; cursor: pointer;
  }
  button.send:disabled { opacity: .4; cursor: default; }
  .hint { max-width: 780px; margin: 8px auto 0; color: var(--muted); font-size: 11.5px; }

  @media (max-width: 760px) {
    aside { position: absolute; z-index: 10; height: 100%; transform: translateX(-100%); transition: transform .2s; }
    aside.open { transform: none; }
    .menu-btn { display: block !important; }
  }
  .menu-btn { display: none; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <h1>{{APP_NAME}}</h1>
      <p>{{APP_SUBTITLE}}</p>
    </div>
    <nav class="roster" id="roster"></nav>
  </aside>

  <main>
    <header>
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <span class="emoji" id="h-emoji"></span>
      <div>
        <h2 id="h-name"></h2>
        <div class="module" id="h-module"></div>
      </div>
    </header>

    <div id="chat"></div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Ask your agent…"></textarea>
        <button class="send" id="send">Send</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line · Switching agents keeps each agent's own conversation</div>
    </div>
  </main>

<script>
let agents = [];
let current = null;
const histories = {};           // agentId -> [{role, content}]
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

async function init() {
  agents = await (await fetch("/api/agents")).json();
  const roster = document.getElementById("roster");
  roster.innerHTML = "";
  for (const a of agents) {
    const b = document.createElement("button");
    b.className = "agent";
    b.id = "agent-" + a.id;
    b.innerHTML = `<span class="emoji">${a.emoji}</span>
      <span><span class="name">${a.name}</span><br>
      <span class="tag">${a.tagline}</span>
      ${a.hasKnowledge ? '<br><span class="kbadge">source notes loaded</span>' : ""}</span>`;
    b.onclick = () => selectAgent(a.id);
    roster.appendChild(b);
  }
  selectAgent(agents[0].id);
}

function selectAgent(id) {
  current = agents.find(a => a.id === id);
  document.querySelectorAll(".agent").forEach(el => el.classList.toggle("active", el.id === "agent-" + id));
  document.getElementById("h-emoji").textContent = current.emoji;
  document.getElementById("h-name").textContent = current.name;
  document.getElementById("h-module").textContent = current.module;
  document.getElementById("sidebar").classList.remove("open");
  histories[id] ||= [];
  render();
}

function mdLite(text) {
  // minimal safe rendering: escape HTML, then bold / inline code / fenced code
  let s = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.replace(/^\w+\n/, "")}</code></pre>`);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  return s;
}

function render(streamingText) {
  const h = histories[current.id];
  let html = "";
  if (h.length === 0 && streamingText === undefined) {
    html = `<div class="intro-card">
      <div class="big">${current.emoji}</div>
      <h3>${current.name}</h3>
      <p>${current.intro}</p>
    </div>`;
  }
  for (const m of h) {
    html += `<div class="msg ${m.role}">
      <div class="avatar">${m.role === "user" ? "🧑" : current.emoji}</div>
      <div class="body">${mdLite(m.content)}</div></div>`;
  }
  if (streamingText !== undefined) {
    html += `<div class="msg assistant">
      <div class="avatar">${current.emoji}</div>
      <div class="body">${mdLite(streamingText)}▍</div></div>`;
  }
  chatEl.innerHTML = html;
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  const agent = current;
  inputEl.value = "";
  autoGrow();
  histories[agent.id].push({ role: "user", content: text });
  render("");
  sendBtn.disabled = true;

  let acc = "";
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ agentId: agent.id, messages: histories[agent.id] })
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e.error || ("HTTP " + resp.status));
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "", ev = "message";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith("event: ")) { ev = line.slice(7).trim(); continue; }
        if (!line.startsWith("data: ")) continue;
        const data = JSON.parse(line.slice(6));
        if (ev === "error") throw new Error(data.error);
        if (data.text) { acc += data.text; if (agent === current) render(acc); }
        ev = "message";
      }
    }
    histories[agent.id].push({ role: "assistant", content: acc || "(empty response)" });
  } catch (err) {
    histories[agent.id].push({ role: "assistant", content: "⚠️ " + err.message });
  }
  sendBtn.disabled = false;
  if (agent === current) render();
  inputEl.focus();
}

function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
}

sendBtn.onclick = send;
inputEl.addEventListener("input", autoGrow);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

init();
</script>
</body>
</html>
